- name: Installeer k8s en ArgoCD op AlmaLinux
  hosts: almaNode1
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - sudoPassword.yml
    - gitKey.yml
  vars:
    ansible_become_password: "{{ sudo_password }}"
    git_token: "{{ git_token }}"
  gather_facts: yes
  tasks:
#---System- en kernelvoorbereidingen---
    #---Swap---
    - name: Disable swap (runtime)
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: ansible_swaptotal_mb | int > 0

    - name: Comment out swap entries in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\sswap\s'
        state: absent

    #---Kernel modules---
    - name: Persist kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: '0644'

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    #---Sysctl---
    - name: Apply sysctl params for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: net.bridge.bridge-nf-call-iptables,  value: 1 }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: 1 }
        - { name: net.ipv4.ip_forward,                 value: 1 }

    #---SELinux---
    - name: Set SELinux to permissive
      ansible.builtin.command: setenforce 0
      when: ansible_selinux.status == "enabled"

    - name: Persist SELinux permissive
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'

    #---Time synchronization---
    - name: Install chrony
      ansible.builtin.dnf:
        name: chrony
        state: present

    - name: Enable and start chrony
      ansible.builtin.systemd:
        name: chronyd
        enabled: yes
        state: started

    #---Firewall---
    - name: Disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: no

#---Container runtime---
    #---Docker repo---
    - name: Install required packages for containerd repo
      ansible.builtin.dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    - name: Add Docker CE repository
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled: yes
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/centos/gpg

    #---Containerd---
    - name: Install containerd
      ansible.builtin.dnf:
        name: containerd.io
        state: present

    #---Config---
    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_config
      changed_when: false

    - name: Write containerd config
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_config.stdout }}"

    #---Service---
    - name: Enable systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: yes
        state: restarted

#---IPVS modules---
    - name: Load IPVS modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/ipvs.conf
        content: |
          ip_vs
          ip_vs_rr
          ip_vs_wrr
          ip_vs_sh
          nf_conntrack

#---k8s installeren---
    #---Kubernetes repository---
    - name: Add Kubernetes repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
        enabled: yes
        gpgcheck: yes
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key

    #---Kubernetes tools---
    - name: Install Kubernetes components
      ansible.builtin.dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes

#---Installation success checks---
    #---Check for kubeadm---
    - name: Check kubeadm version
      ansible.builtin.command: kubeadm version -o short
      register: kubeadm_version

    - name: Show kubeadm version
      ansible.builtin.debug:
        msg: "kubeadm version: {{ kubeadm_version.stdout }}"

    #---Check for kubectl---
    - name: Check kubectl client version
      ansible.builtin.command: kubectl version --client -o json
      register: kubectl_version_json

    - name: Parse kubectl version
      ansible.builtin.set_fact:
        kubectl_client_version: "{{ (kubectl_version_json.stdout | from_json).clientVersion.gitVersion }}"

    - name: Show kubectl client version
      ansible.builtin.debug:
        msg: "kubectl client version: {{ kubectl_client_version }}"

    #---Check for kubelet
    - name: Check kubelet service status
      ansible.builtin.systemd:
        name: kubelet
        state: started
      register: kubelet_status

    - name: Show kubelet status
      ansible.builtin.debug:
        msg: "Kubelet is {{ 'active' if kubelet_status.status.ActiveState == 'active' else 'inactive' }}"

#---k8s configureren---
    #---Cluster initialization---
    - name: Initialize single-node Kubernetes cluster
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Create .kube directory for admin user
      ansible.builtin.file:
        path: /home/admin/.kube
        state: directory
        owner: admin
        group: admin
        mode: 0700

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/admin/.kube/config
        remote_src: yes
        owner: admin
        group: admin
        mode: 0600

    #---CNI Network---
    - name: Apply Flannel CNI
      ansible.builtin.command: >
        kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /home/admin/.kube/config

#---ArgoCD installeren---
    #---Namespace aanmaken---
    - name: Ensure ArgoCD namespace exists
      ansible.builtin.command: >
        kubectl apply -f -
      environment:
        KUBECONFIG: /home/admin/.kube/config
      args:
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: argocd

    - name: Apply ArgoCD manifests
      ansible.builtin.command: >
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      environment:
        KUBECONFIG: /home/admin/.kube/config

#---ArgoCD Juice Shop deployen---
    #---Git repo access---
    - name: Add Git credentials to ArgoCD
      ansible.builtin.command: >
        kubectl apply -f -
      environment:
        KUBECONFIG: /home/admin/.kube/config
      args:
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: juiceshop-git-repo
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: https://github.com/skatingm-cmd/juice-shop-git.git
            username: git
            password: "{{ git_token }}"

    #---Juice Shop namespace---
    - name: Create Juice Shop namespace
      ansible.builtin.command: >
        kubectl create namespace juiceshop
      environment:
        KUBECONFIG: /home/admin/.kube/config
      args:
        creates: /var/lib/kube-juiceshop-namespace

    #---Juice Shop deployen---
    - name: Deploy Juice Shop via ArgoCD
      ansible.builtin.command: >
        kubectl apply -f -
      environment:
        KUBECONFIG: /home/admin/.kube/config
      args:
        stdin: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: juiceshop
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/skatingm-cmd/juice-shop-git.git
              targetRevision: main
              path: .
              helm:
                releaseName: juiceshop
            destination:
              server: https://kubernetes.default.svc
              namespace: juiceshop
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
