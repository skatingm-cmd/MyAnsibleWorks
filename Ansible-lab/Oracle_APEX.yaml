- name: Install Oracle APEX on Oracle Linux
  hosts: oracleNode2
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - sudoPassword.yml
  vars:
    ansible_become_password: "{{ sudo_password }}"
  gather_facts: no
  tasks:
    #---Make system up to date---
    - name: Update system
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Remove obsolete packages
      ansible.builtin.dnf:
        autoremove: true

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after updates."
        connect_timeout: 5
        reboot_timeout: 600
      when: reboot_required.stat.exists

    #---Install Oracle Database prerequisites---
    - name: Install vim
      ansible.builtin.dnf:
        name: vim
        state: present

    - name: Install unzip
      ansible.builtin.dnf:
        name: unzip
        state: present

    - name: Install database preinstall module
      ansible.builtin.dnf:
        name: oracle-database-preinstall-23ai
        state: present

    #---Install Oracle Database---
    - name: Download database RPM
      get_url:
        url: https://download.oracle.com/otn-pub/otn_software/db-free/oracle-database-free-23ai-23.8-1.el9.x86_64.rpm
        dest: /tmp/oracle-database-free-23ai-23.8-1.el8.x86_64.rpm

    - name: Install database RPM
      dnf:
        name: /tmp/oracle-database-free-23ai-23.8-1.el8.x86_64.rpm
        state: present
