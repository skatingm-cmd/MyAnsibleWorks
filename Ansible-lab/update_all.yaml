---
- name: Update all Linux nodes (AlmaLinux + Oracle Linux)
  hosts:
    - almaNodes
    - oracleNodes
    - ubuntuNodes
  become: yes
  become_method: sudo
  become_user: root
  vars_files:
    - sudoPassword.yml
  vars:
    ansible_become_password: "{{ sudo_password }}"
  gather_facts: yes
  tasks:
     # ---- RHEL / Alma / Oracle Linux updates ----
    - name: Update packages on RHEL-based systems
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Autoremove on RHEL-based systems
      ansible.builtin.dnf:
        autoremove: true
      when: ansible_os_family == "RedHat"

    # ---- Ubuntu / Debian updates ----
    - name: Update package cache on Debian-based systems
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Upgrade packages on Debian-based systems
      ansible.builtin.apt:
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Autoremove on Debian-based systems
      ansible.builtin.apt:
        autoremove: yes
      when: ansible_os_family == "Debian"

    # ---- Check reboot requirement ----
    - name: Check if reboot is required (generic)
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after updates."
        connect_timeout: 5
        reboot_timeout: 600
      when: reboot_required.stat.exists
