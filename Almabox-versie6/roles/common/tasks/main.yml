# tasks file for common
---
- name: Python runtime
  import_tasks: python.yml

- name: Use Kubernetes Python virtualenv
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ python_venv_interpreter }}"
  when: inventory_hostname in groups['controlplane']

- name: Swap
  import_tasks: swap.yml

- name: Kernel modules
  import_tasks: kernelmodules.yml

- name: Sysctl parameters
  import_tasks: sysctl.yml

- name: SELinux
  import_tasks: selinux.yml

- name: Time Synchronization
  import_tasks: timesync.yml

- name: Firewall settings
  import_tasks: firewalld.yml
