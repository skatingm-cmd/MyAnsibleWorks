---
- name: Install base Python packages
  ansible.builtin.package:
    name: "{{ python_packages }}"
    state: present

- name: Create Python virtualenv for Kubernetes tooling
  ansible.builtin.command:
    cmd: python3 -m venv "{{ python_venv_path }}"
    creates: "{{ python_venv_path }}/bin/python"
  when: inventory_hostname in groups['controlplane']

- name: Upgrade pip inside virtualenv
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: "{{ python_venv_path }}"
  when: inventory_hostname in groups['controlplane']

- name: Install Python dependencies for kubernetes.core
  ansible.builtin.pip:
    name: "{{ python_pip_packages }}"
    state: present
    virtualenv: "{{ python_venv_path }}"
  when: inventory_hostname in groups['controlplane']

- name: Assert configured Python modules are importable
  ansible.builtin.command:
    cmd: >
      {{ python_venv_interpreter }} -c "{% for module in python_imports %}import {{ module }};{% endfor %}print('OK')"
  changed_when: false
  when: inventory_hostname in groups['controlplane']
