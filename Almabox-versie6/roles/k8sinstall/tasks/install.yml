---
- name: Ensure containerd service is running
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Install Kubernetes packages (all nodes)
  ansible.builtin.package:
    name: "{{ kubernetes_node_packages }}"
    state: present

- name: Install kubectl (controlplane only)
  ansible.builtin.package:
    name: "{{ kubernetes_controlplane_packages }}"
    state: present
  when: inventory_hostname in groups['controlplane']

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Ensure kubelet is stopped before kubeadm init
  ansible.builtin.systemd:
    name: kubelet
    state: stopped
