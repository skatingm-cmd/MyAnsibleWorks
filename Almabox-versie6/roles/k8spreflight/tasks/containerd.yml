---
- name: Verify containerd CRI is available
  ansible.builtin.command: crictl info
  changed_when: false

- name: Check containerd service
  ansible.builtin.systemd:
    name: containerd
  register: containerd_service

- name: Check containerd socket exists
  ansible.builtin.stat:
    path: /run/containerd/containerd.sock
  register: containerd_socket

- name: Fail if containerd is not healthy
  ansible.builtin.fail:
    msg: >
      containerd is not healthy.
      Service state: {{ containerd_service.status.ActiveState }}
      Socket exists: {{ containerd_socket.stat.exists }}
  when: >
    containerd_service.status.ActiveState != "active"
    or not containerd_socket.stat.exists
