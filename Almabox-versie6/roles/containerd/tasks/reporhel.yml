---
- name: Install required packages for containerd repo
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: present

- name: Determine Docker repo release version
  ansible.builtin.set_fact:
    docker_repo_releasever: >-
      {{ docker_repo_map[ansible_facts['distribution_major_version']] }}

- name: Add Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: "https://download.docker.com/linux/centos/{{ docker_repo_releasever }}/$basearch/stable"
    enabled: yes
    gpgcheck: yes
    gpgkey: https://download.docker.com/linux/centos/gpg
