---
- name: Kubernetes preflight checks
  ansible.builtin.debug:
    msg: "Running Kubernetes preflight checks"

- name: Check swap is disabled
  ansible.builtin.command: swapon --summary
  register: swap_check
  changed_when: false

- name: Fail if swap is enabled
  ansible.builtin.fail:
    msg: "Swap is enabled. Kubernetes requires swap to be disabled."
  when: swap_check.stdout | trim != ""

- name: Check ip_forward sysctl
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: ip_forward
  changed_when: false

- name: Fail if ip_forward is not enabled
  ansible.builtin.fail:
    msg: "net.ipv4.ip_forward must be set to 1"
  when: ip_forward.stdout != "1"

- name: Check bridge-nf-call-iptables sysctl
  ansible.builtin.command: sysctl -n net.bridge.bridge-nf-call-iptables
  register: br_nf_iptables
  changed_when: false

- name: Fail if bridge-nf-call-iptables is not enabled
  ansible.builtin.fail:
    msg: >
      net.bridge.bridge-nf-call-iptables must be set to 1.
      Did you run the common role?
  when: br_nf_iptables.stdout != "1"

- name: Check containerd service
  ansible.builtin.systemd:
    name: containerd
  register: containerd_service

- name: Check containerd socket exists
  ansible.builtin.stat:
    path: /run/containerd/containerd.sock
  register: containerd_socket

- name: Fail if containerd is not healthy
  ansible.builtin.fail:
    msg: >
      containerd is not healthy.
      Service state: {{ containerd_service.status.ActiveState }}
      Socket exists: {{ containerd_socket.stat.exists }}
  when: >
    containerd_service.status.ActiveState != "active"
    or not containerd_socket.stat.exists

- name: Fail if hostname is localhost
  ansible.builtin.fail:
    msg: "Hostname is localhost — Kubernetes will break"
  when:
    - (ansible_hostname | lower).startswith('localhost')
    - inventory_hostname != 'localhost'

- name: Check for existing Kubernetes config
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: existing_cluster
  when: inventory_hostname in groups['controlplane']

- name: Fail if Kubernetes is already initialized
  ansible.builtin.fail:
    msg: "Kubernetes appears to be already initialized. Run kubeadm reset first."
  when:
    - existing_cluster.stat.exists
    - and inventory_hostname in groups['controlplane']

