---
# tasks file for roles/kubernetes
# --- Kubernetes repository ---
- name: Add Kubernetes repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
    enabled: yes
    gpgcheck: yes
    gpgkey: https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key

# --- Kubernetes packages ---
- name: Install Kubernetes components
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes

# --- IPVS kernel modules (recommended) ---
- name: Ensure IPVS modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/ipvs.conf
    content: |
      ip_vs
      ip_vs_rr
      ip_vs_wrr
      ip_vs_sh
      nf_conntrack
    mode: '0644'

- name: Load IPVS modules
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - ip_vs
    - ip_vs_rr
    - ip_vs_wrr
    - ip_vs_sh
    - nf_conntrack

# --- kubeadm init ---
- name: Initialize single-node Kubernetes cluster
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr=10.244.0.0/16
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

# --- kubeconfig for admin user ---
- name: Create .kube directory for admin
  ansible.builtin.file:
    path: /home/admin/.kube
    state: directory
    owner: admin
    group: admin
    mode: '0700'

- name: Copy admin kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/admin/.kube/config
    remote_src: yes
    owner: admin
    group: admin
    mode: '0600'

- name: Allow scheduling on control-plane node (single-node cluster)
  ansible.builtin.command: >
    kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  environment:
    KUBECONFIG: /home/admin/.kube/config
  changed_when: false
  failed_when: false


# --- Install Flannel CNI ---
- name: Apply Flannel CNI
  ansible.builtin.command: >
    kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
  environment:
    KUBECONFIG: /home/admin/.kube/config