---
- name: Render ingress-nginx Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/ingress-nginx-values.yaml
    mode: "0644"

- name: Install ingress-nginx via Helm
  kubernetes.core.helm:
    name: "{{ ingress_nginx_release_name }}"
    chart_ref: "{{ ingress_nginx_chart }}"
    chart_repo_url: "{{ ingress_nginx_repo_url }}"
    release_namespace: "{{ ingress_nginx_namespace }}"
    values_files:
      - /tmp/ingress-nginx-values.yaml
    state: present
    wait: true
    timeout: 6m
    binary_path: "{{ helm_install_dir }}/helm"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
